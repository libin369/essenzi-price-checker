<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#211e1a"><link rel="manifest" href="manifest.json"><title>Essenzi Exhibition Price Checker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#211e1a;font:16px system-ui,sans-serif}main{max-width:480px;margin:auto;padding:22px}header{text-align:center;padding:14px 0 24px}h1{font:32px Georgia,serif;letter-spacing:7px;margin:0}small{color:#77684e}button,input{font:inherit;border-radius:12px;padding:14px;border:1px solid #d6cbb6}button{cursor:pointer;background:#211e1a;color:#fff;font-weight:600}button:disabled{opacity:.5}input{width:100%;background:white;min-width:0}form{display:flex;gap:8px;margin:12px 0}.wide{width:100%;padding:20px;color:#e4c68d}.panel{background:white;border:1px solid #e3dacb;border-radius:18px;padding:20px;margin-top:16px;text-align:center}.was{font-size:24px;color:#777;text-decoration:line-through}.now{font-size:42px;color:#176b44;font-weight:750;margin:5px 0}.label{font-size:12px;letter-spacing:2px;color:#846c40}h2{font-size:19px;margin:12px 0}#status{font-size:12px;text-align:center;margin:12px 0;color:#665c4b}#results button{width:100%;margin:5px 0;text-align:left}video{width:100%;border-radius:12px;margin-top:10px}#camera[hidden]{display:none}.secondary{background:transparent;color:#211e1a;width:100%;margin-top:14px}.warn{color:#9b4815;font-weight:600}.save{background:#edf5ed;color:#176b44;padding:10px;border-radius:10px;margin-top:10px}footer{text-align:center;margin-top:28px;font-size:12px;color:#77684e}

/* Mobile readability update */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:Arial,system-ui,sans-serif;font-size:18px;line-height:1.45}
main{width:100%;max-width:640px;padding:24px 20px 32px}
header{padding:16px 0 28px}h1{font-size:clamp(36px,9vw,52px);letter-spacing:5px;line-height:1.2}header small{display:block;font-size:14px;letter-spacing:1.2px;margin-top:8px;font-weight:600}
button,input{font-size:18px;min-height:56px;padding:14px 16px}button{touch-action:manipulation}.wide{min-height:76px;font-size:21px;padding:20px 12px}form{margin:16px 0;gap:8px}form button{flex-shrink:0}input::placeholder{color:#665c4b;font-size:16px}
#status{font-size:14px;line-height:1.5;margin:16px 0;overflow-wrap:anywhere}.secondary{min-height:58px;font-size:18px;margin-top:16px}.panel{padding:24px 16px;margin-top:18px}.panel small{font-size:16px}.panel h2{font-size:23px;line-height:1.3;overflow-wrap:anywhere}.label{font-size:15px;font-weight:600;letter-spacing:1.4px}.was{font-size:30px}.now{font-size:clamp(36px,9vw,54px);line-height:1.2;overflow-wrap:anywhere}.save{font-size:17px;font-weight:600;padding:14px 8px}footer{font-size:14px;margin-top:30px}
@media(max-width:380px){main{padding:20px 14px}form button{padding:12px}input{padding:12px}header small{font-size:12px}}
@media(min-width:641px) and (pointer:coarse){main{max-width:92%;font-size:22px}button,input{font-size:22px;min-height:68px}.wide{font-size:25px}#status,footer{font-size:17px}}
</style></head><body><main><header><h1>ESSENZI</h1><small>EXHIBITION PRICE CHECKER</small></header><button id="scan" class="wide">▥ &nbsp; SCAN BARCODE</button><div id="camera" hidden><video id="video" autoplay playsinline muted></video><button id="stop" class="secondary">Close camera</button></div><form id="search"><input id="query" placeholder="Barcode or item code" autocomplete="off" aria-label="Barcode or item code"><button>Search</button></form><div id="status" role="status">Loading prices…</div><section id="results" aria-live="polite"></section><button id="sync" class="secondary">↻ Sync prices</button><footer>ESSENZI · Exhibition use only</footer></main><script src="app.js"></script></body></html>
