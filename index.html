<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#211e1a"><link rel="manifest" href="manifest.json"><title>Essenzi Exhibition Price Checker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#211e1a;font:16px system-ui,sans-serif}main{max-width:480px;margin:auto;padding:22px}header{text-align:center;padding:14px 0 24px}h1{font:32px Georgia,serif;letter-spacing:7px;margin:0}small{color:#77684e}button,input{font:inherit;border-radius:12px;padding:14px;border:1px solid #d6cbb6}button{cursor:pointer;background:#211e1a;color:#fff;font-weight:600}button:disabled{opacity:.5}input{width:100%;background:white;min-width:0}form{display:flex;gap:8px;margin:12px 0}.wide{width:100%;padding:20px;color:#e4c68d}.panel{background:white;border:1px solid #e3dacb;border-radius:18px;padding:20px;margin-top:16px;text-align:center}.was{font-size:24px;color:#777;text-decoration:line-through}.now{font-size:42px;color:#176b44;font-weight:750;margin:5px 0}.label{font-size:12px;letter-spacing:2px;color:#846c40}h2{font-size:19px;margin:12px 0}#status{font-size:12px;text-align:center;margin:12px 0;color:#665c4b}#results button{width:100%;margin:5px 0;text-align:left}video{width:100%;border-radius:12px;margin-top:10px}#camera[hidden]{display:none}.secondary{background:transparent;color:#211e1a;width:100%;margin-top:14px}.warn{color:#9b4815;font-weight:600}.save{background:#edf5ed;color:#176b44;padding:10px;border-radius:10px;margin-top:10px}footer{text-align:center;margin-top:28px;font-size:12px;color:#77684e}
